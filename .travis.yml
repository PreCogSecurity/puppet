language: ruby
cache: bundler
before_install:
  # Bundler 2.1.x is the last series that supports the Ruby versions this
  # project targets (>= 1.9.3) and is compatible with the committed
  # Gemfile.lock (BUNDLED WITH 2.1.4).
  - gem install bundler -v 2.1.4
bundler_args: --without development extra
rvm:
  - 2.3.1
script:
  - bundle exec rspec spec
jobs:
  include:
    - name: "coverage (SimpleCov gate)"
      rvm: 2.3.1
      script: COVERAGE=yes MINIMUM_COVERAGE=40 bundle exec rspec spec
    - name: "lint (RuboCop)"
      rvm: 2.3.1
      script: bundle exec rake rubocop
    - name: "commit message check"
      rvm: 2.3.1
      script: bundle exec rake commits
    - name: "dependency audit (bundler-audit)"
      rvm: 2.3.1
      script: bundle exec bundle-audit check --update
    - name: "secret scan"
      rvm: 2.3.1
      script: bundle exec ruby util/ci/secret_scan.rb
notifications:
  email: false